<div class="form-view">

    <header class="form-header">
        <h1>Añadir Unidad al Sistema</h1>
        <button class="form-close" aria-label="Cerrar">X</button>
    </header>

    <form class="form-body" id="formUnidad">

        <h2 class="form-title">Ingrese los Datos de la Unidad</h2>

        <div class="form-group">
            <label for="unidad-nombre">Nombre</label>
            <input type="text" id="unidad-nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label for="unidad-ubicacion">Ubicación en el Hospital</label>
            <input type="text" id="unidad-ubicacion" name="ubicacion" required>
        </div>

        <div class="form-group">
            <label for="unidad-identificador">Identificador</label>
            <input type="text" id="unidad-identificador" name="identificador" required>
        </div>

        <div class="form-group">
            <label for="unidad-departamento">
                Seleccione el Departamento a Añadir la Unidad
            </label>
            <select id="unidad-departamento" name="departamento" required>
                <option value="">-- Seleccione un departamento --</option>
                <option value="onc-emer">Departamento de Emergencias -- OncEmer</option>
                <option value="derma">Dermatología</option>
                <option value="oncologia">Departamento de Oncología</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Añadir</button>
        </div>

    </form>

</div>
