<div class="form-view form-view-sm">

    <header class="form-header">
        <h1>Añadir Hospital al Sistema</h1>
        <button class="form-close" aria-label="Cerrar">X</button>
    </header>

    <form class="form-body" id="formHospital">

        <h2 class="form-title">Ingrese los Datos del Hospital</h2>

        <div class="form-group">
            <label for="hosp-nombre">Nombre</label>
            <input type="text" id="hosp-nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label for="hosp-identificador">Identificador</label>
            <input type="text" id="hosp-identificador" name="identificador" class="input-short" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Añadir</button>
        </div>

    </form>

</div>
