<div class="login-view">

    <form class="login-box" id="loginForm">
        <h1>Mi Hospital</h1>
        <p>Inicia sesión para continuar</p>

        <div class="form-group">
            <label for="login-user">Usuario</label>
            <input type="text" id="login-user" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="login-pass">Contraseña</label>
            <input type="password" id="login-pass" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary login-btn">Entrar</button>

        <p class="login-error" id="loginError" hidden>Usuario o contraseña incorrectos.</p>
    </form>

</div>
